# 文昌智脑 V1.4 MCP Client 示例。
#
# 使用方法：
# 1. 复制为 config/mcp-servers.yml（该真实配置不应提交密钥）。
# 2. 选择并填写一个真实 MCP Server；不使用的 connection 请删除。
# 3. 重启应用，GET /api/agent/tools 应出现相应 mcpTools。
spring:
  config:
    activate:
      on-profile: mcp
  ai:
    mcp:
      client:
        enabled: true
        initialized: true
        type: SYNC
        request-timeout: 20s
        toolcallback:
          enabled: true

        # Streamable HTTP 示例（推荐的新 HTTP 协议）。
        streamable-http:
          connections:
            wenchang-public-resource:
              url: http://127.0.0.1:8091
              endpoint: /mcp

        # STDIO 示例。启用时请删除上面的示例或确保两个 Server 都真实存在。
